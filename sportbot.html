        .badge { position: absolute; top: 10px; left: 10px; background: rgba(9, 13, 22, 0.8); color: #38bdf8; font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 8px; z-index: 2; }
        .card-body { padding: 12px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
        .card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .card-meta { font-size: 12px; color: #94a3b8; margin-bottom: 10px; }
        .card-footer { display: flex; align-items: center; justify-content: space-between; }
        .price { font-size: 15px; font-weight: 700; color: #10b981; }
        .order-btn { background: #3b82f6; color: white; border: none; padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .quick-replies { display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; background: #090d16; border-top: 1px solid rgba(255,255,255,0.06); }
        .chip { background: #131b2e; color: #e2e8f0; border: 1px solid rgba(255,255,255,0.12); padding: 9px 15px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; font-weight: 500; }
        .chip:active { background: #3b82f6; color: #fff; }
        .input-area { display: flex; padding: 10px 16px; background: #131b2e; gap: 10px; align-items: center; }
        input { flex: 1; background: #090d16; color: #fff; padding: 12px 16px; border: 1px solid rgba(255,255,255,0.12); border-radius: 24px; outline: none; font-size: 15px; }
        .send-btn { background: #2563eb; color: white; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 16px; flex-shrink: 0; }
    </style>
</head>

function addMsg(html, type) {
    var d = document.createElement('div');
    d.className = 'msg ' + type;
    d.innerHTML = html;
    chatBox.appendChild(d);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function orderProduct(name) {
    addMsg("🛒 " + name + " захиалах", "user");
    setTimeout(function() {
        addMsg("Баярлалаа! <b>" + name + "</b> сагсанд нэмэгдлээ ✅<br>Захиалга баталгаажуулахын тулд <b>утасны дугаар болон размераа</b> бичнэ үү. 📞", "bot");
    }, 300);
}

function showCards(list) {
    var wrap = document.createElement('div');
    wrap.className = 'product-carousel';
    for (var i = 0; i < list.length; i++) {
        var item = list[i];
        var card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = '<div class="card-img-wrap"><span class="badge">' + item.tag + '</span>' +
                         '<img src="' + item.img + '" alt="' + item.name + '"></div>' +
                         '<div class="card-body"><div><div class="card-title">' + item.name + '</div><div class="card-meta">' + item.meta + '</div></div>' +
                         '<div class="card-footer"><span class="price">' + item.price + '</span><button type="button" class="order-btn" onclick="orderProduct(\'' + item.name + '\')">Захиалах</button></div></div>';
        wrap.appendChild(card);
    }
    chatBox.appendChild(wrap);
    chatBox.scrollTop = chatBox.scrollHeight;
}
